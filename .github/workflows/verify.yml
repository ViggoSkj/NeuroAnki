name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r bridge/requirements.lock
      - run: python -m pip install --no-deps -e ./bridge
      - run: dotnet build NeuroAnki.sln -c Release
      - run: dotnet test NeuroAnki.sln -c Release --no-build
      - run: python -m pytest bridge/tests -q
      - run: python scripts/verify_mock.py
