[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-anki-bridge"
version = "0.1.0"
description = "fastanki HTTP bridge and SQLite in-memory mock sharing one API"
requires-python = ">=3.11"
dependencies = ["fastanki==0.0.3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
neuro-anki = "neuro_anki.__main__:main"

[tool.setuptools.packages.find]
include = ["neuro_anki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
